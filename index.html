<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Games Archive Mirror</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #1a1a2e; color: #eee; }
        pre { background: #16213e; padding: 15px; border-radius: 8px; overflow-x: auto; }
        a { color: #e94560; }
    </style>
</head>
<body>
    <h1>🎮 Games Archive Mirror</h1>
    <p>
        تحميل مباشر: 
        <a href="GAMES-archive.org-formatted.json">GAMES-archive.org-formatted.json</a>
    </p>
    <pre id="data">جاري التحميل...</pre>
    <script>
        fetch('GAMES-archive.org-formatted.json')
            .then(r => r.json())
            .then(d => document.getElementById('data').textContent = JSON.stringify(d, null, 2))
            .catch(e => document.getElementById('data').textContent = 'خطأ: ' + e.message);
    </script>
</body>
</html>
