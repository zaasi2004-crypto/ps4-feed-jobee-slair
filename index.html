<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games Archive Mirror</title>
<style>
  body { font-family: system-ui, Arial; margin: 0; background:#12121f; color:#eee; }
  header { padding:16px 20px; background:#1a1a2e; border-bottom:2px solid #e94560; }
  h1 { margin:0 0 10px; color:#e94560; font-size:20px; }
  #search { width:100%; max-width:420px; padding:8px 12px; border-radius:6px;
            border:1px solid #333; background:#16213e; color:#eee; }
  #stats { color:#8ab; font-size:13px; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:6px 10px; border-bottom:1px solid #23233a; text-align:right; }
  th { background:#16213e; position:sticky; top:0; }
  tr:hover { background:#1c1c30; }
  nav { padding:12px 20px; display:flex; gap:8px; align-items:center; }
  button { padding:6px 12px; border:0; border-radius:6px; background:#e94560;
           color:#fff; cursor:pointer; }
  button:disabled { background:#444; cursor:default; }
  a { color:#e94560; }
</style>
</head>
<body>
<header>
  <h1>🎮 Games Archive Mirror</h1>
  <input id="search" placeholder="ابحث...">
  <div id="stats">جاري التحميل...</div>
  <p style="margin:6px 0 0;font-size:13px">
    تحميل خام: <a href="GAMES-archive.org-formatted.json">JSON</a>
  </p>
</header>

<nav>
  <button id="prev">السابق</button>
  <span id="page"></span>
  <button id="next">التالي</button>
</nav>

<div style="overflow-x:auto"><table><tbody id="rows"></tbody></table></div>

<script>
const PAGE = 100;
let all = [], view = [], page = 0;

fetch('GAMES-archive.org-formatted.json')
  .then(r => r.json())
  .then(d => {
    all = Array.isArray(d) ? d : (d.items || d.games || Object.values(d));
    document.getElementById('stats').textContent = 'إجمالي العناصر: ' + all.length;
    render();
  })
  .catch(e => document.getElementById('stats').textContent = 'خطأ: ' + e.message);

function filter(q) {
  q = q.trim().toLowerCase();
  view = !q ? all : all.filter(x => JSON.stringify(x).toLowerCase().includes(q));
  page = 0; render();
}

function render() {
  const start = page * PAGE, slice = view.slice(start, start + PAGE);
  document.getElementById('rows').innerHTML =
    '<tr><th>#</th><th>البيانات</th></tr>' +
    slice.map((x, i) =>
      `<tr><td>${start + i + 1}</td><td>${esc(typeof x === 'object' ? JSON.stringify(x) : x)}</td></tr>`
    ).join('');
  document.getElementById('page').textContent =
    (page + 1) + ' / ' + Math.max(1, Math.ceil(view.length / PAGE));
  document.getElementById('prev').disabled = page === 0;
  document.getElementById('next').disabled = (page + 1) * PAGE >= view.length;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('search').addEventListener('input', e => filter(e.target.value));
document.getElementById('prev').onclick = () => { if (page > 0) { page--; render(); } };
document.getElementById('next').onclick = () => { page++; render(); };
</script>
</body>
</html>
